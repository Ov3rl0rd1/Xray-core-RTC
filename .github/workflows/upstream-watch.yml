name: Upstream watch

# Watches XTLS/Xray-core for a new RELEASE, tries the fork against it, and
# reports. It never pushes anything and never moves this repository: a VPN data
# plane should not update itself behind your back, and a conflict is a decision,
# not a build failure.
#
# What it does when upstream tags a release:
#   1. rebuilds the fork on that tag  — upstream tree + overlay + patches
#   2. re-pins deps and runs go mod tidy
#   3. builds, vets, and runs the test suite
#   4. opens (or updates) a single issue with the verdict
#
# Release tags only, not main: main moves daily and half of it never ships.
#
# When the issue says everything applies, adopting it locally is two commands:
#   ./fork/bin/fork adopt vYY.M.D
#   ./fork/bin/fork export        # only if you had to resolve anything

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence for a fork whose whole
    # point is that updates are cheap — often enough to catch a breaking change
    # while it is still one change, rare enough to be ignorable.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to test (blank = newest release tag)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/XTLS/Xray-core.git 2>/dev/null || true
          git fetch --quiet --tags upstream

      - name: Decide what to test
        id: decide
        run: |
          BASE="$(tr -d ' \t\r\n' < fork/upstream.txt)"
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="$(git tag -l --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"

          if [ "$BASE" = "$REF" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already on $BASE — nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream released $REF (we are on $BASE)."
          fi

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.up_to_date == 'false'
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Apply the fork onto ${{ steps.decide.outputs.ref }}
        if: steps.decide.outputs.up_to_date == 'false'
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./fork/bin/fork build "${{ steps.decide.outputs.ref }}" /tmp/trial 2>&1 | tee /tmp/apply.log

      - name: Fetch the geodata the suite reads
        # Four of upstream's tests read resources/*.dat, and this job used to run
        # without them. The comment below the test command claimed those failures
        # were tolerated; nothing implemented that, so every watch reported a fork
        # that was fine as broken. A watch that cries wolf weekly is worse than no
        # watch. Fetching them is cheap; failing to is not worth failing the run
        # over, so the report carries the caveat instead.
        if: steps.decide.outputs.up_to_date == 'false' && steps.apply.outcome == 'success'
        id: geodata
        continue-on-error: true
        run: |
          BASE="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release"
          mkdir -p /tmp/trial/resources
          for NAME in geoip geosite; do
            FILE="/tmp/trial/resources/${NAME}.dat"
            if ! curl -sfL "$BASE/${NAME}.dat" -o "$FILE"; then
              echo "could not fetch ${NAME}.dat"
              continue
            fi
            HASH="$(curl -sfL "$BASE/${NAME}.dat.sha256sum" | awk '{print $1}')"
            if [ -n "$HASH" ] && ! echo "$HASH  $FILE" | sha256sum -c - >/dev/null 2>&1; then
              echo "${NAME}.dat failed its checksum - dropping it"
              rm -f "$FILE"
            fi
          done
          ls -l /tmp/trial/resources || true

      - name: Build and test
        if: steps.decide.outputs.up_to_date == 'false' && steps.apply.outcome == 'success'
        id: verify
        continue-on-error: true
        working-directory: /tmp/trial
        run: |
          set +e
          : > /tmp/verify.log
          : > /tmp/failures.md
          failed=0

          # Each phase runs on its own so the report can name the one that broke.
          # The issue used to carry the last 60 lines of the whole run, which for
          # a Go test suite is the part spent on packages that passed: the
          # failures scroll away and the report says only that something broke.
          phase() {
            local name="$1"; shift
            echo "== $name ==" >> /tmp/verify.log
            "$@" > /tmp/phase.log 2>&1
            local rc=$?
            cat /tmp/phase.log >> /tmp/verify.log
            echo "" >> /tmp/verify.log
            if [ "$rc" -ne 0 ]; then
              failed=1
              {
                echo "**$name** failed:"
                echo ""
                echo '```'
                grep -E '^(--- FAIL|FAIL|panic:|# |[^ ]+\.go:[0-9]+:)' /tmp/phase.log | head -30
                echo '```'
                echo ""
              } >> /tmp/failures.md
            fi
            printf '%s: rc=%d\n' "$name" "$rc"
          }

          phase "go get (pinned deps) + go mod tidy" bash "$GITHUB_WORKSPACE/fork/bin/fork" deps .
          phase "go build ./..." go build ./...
          phase "go vet (fork packages)" go vet ./proxy/olcrtc/... ./app/dispatcher/... ./common/pause/... ./transport/internet/hysteria/...
          # -p 2 for the same reason fork/bin/fork check uses it: a couple of
          # upstream tests are timing-sensitive and flake under full parallelism,
          # and a watch that reports a flake as a break is a watch nobody reads.
          phase "go test ./..." go test -timeout 30m -p 2 ./...

          exit $failed

      - name: Compose the report
        if: steps.decide.outputs.up_to_date == 'false'
        id: report
        run: |
          REF="${{ steps.decide.outputs.ref }}"
          BASE="${{ steps.decide.outputs.base }}"

          if [ "${{ steps.apply.outcome }}" != "success" ]; then
            VERDICT="conflicts"
            TITLE="Upstream $REF: patches conflict"
          elif [ "${{ steps.verify.outcome }}" != "success" ]; then
            VERDICT="broken"
            TITLE="Upstream $REF: applies, but build/tests fail"
          else
            VERDICT="clean"
            TITLE="Upstream $REF: applies cleanly"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"     >> "$GITHUB_OUTPUT"

          {
            echo "Upstream released **$REF**; this fork is on **$BASE**."
            echo ""
            case "$VERDICT" in
              clean)
                echo "The fork applies, builds and tests green on it."
                echo ""
                echo "\`\`\`"
                echo "./fork/bin/fork adopt $REF"
                echo "\`\`\`"
                ;;
              conflicts)
                echo "**The patches do not apply.** Rebuild locally and resolve:"
                echo ""
                echo "\`\`\`"
                echo "./fork/bin/fork build $REF /tmp/trial   # leaves conflicts in the tree"
                echo "# resolve there, copy back, then:"
                echo "./fork/bin/fork export"
                echo "\`\`\`"
                ;;
              broken)
                echo "The patches apply, but the result does not build or test cleanly."
                echo "Usually an upstream API change that the overlay has to follow."
                echo ""
                cat /tmp/failures.md 2>/dev/null
                if [ ! -s /tmp/trial/resources/geoip.dat ] || [ ! -s /tmp/trial/resources/geosite.dat ]; then
                  echo "> Note: the geodata download did not complete, so failures in"
                  echo "> \`app/router\`, \`common/geodata\` and \`infra/conf\` may be that"
                  echo "> and not the fork."
                fi
                ;;
            esac
            echo ""
            echo "<details><summary>What changed upstream</summary>"
            echo ""
            echo '```'
            git log --oneline "$BASE..$REF" | head -40
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Applying the fork</summary>"
            echo ""
            echo '```'
            cat /tmp/apply.log 2>/dev/null | tail -40
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Build and test</summary>"
            echo ""
            echo '```'
            cat /tmp/verify.log 2>/dev/null | tail -80
            echo '```'
            echo "</details>"
            echo ""
            echo "<sub>Posted by \`upstream-watch\`. Nothing has been changed in this repository.</sub>"
          } > /tmp/body.md

          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.decide.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="${{ steps.report.outputs.title }}"
          REF="${{ steps.decide.outputs.ref }}"

          gh label create upstream-update \
            --repo "$GH_REPO" \
            --color 1d76db \
            --description "Automated upstream tracking" \
            --force

          EXISTING="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --label upstream-update \
              --search "$REF in:title" \
              --json number,title \
              --jq ".[] | select(.title | contains(\"$REF\")) | .number" \
              2>/dev/null || true
          )"

          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --repo "$GH_REPO" \
              --body-file /tmp/body.md
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --label upstream-update \
              --body-file /tmp/body.md
          fi
          
      - name: Fail the run when the fork does not survive
        if: steps.decide.outputs.up_to_date == 'false'
        # The issue is the deliverable, but a red run is what shows up in the
        # Actions tab and in email — worth having when the fork stops applying.
        run: |
          [ "${{ steps.report.outputs.verdict }}" = "clean" ] || {
            echo "::error::Fork does not apply cleanly to ${{ steps.decide.outputs.ref }} — see the issue"
            exit 1
          }
