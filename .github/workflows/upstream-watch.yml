name: Upstream watch

# Watches XTLS/Xray-core for a new RELEASE, tries the fork against it, and
# reports. It never pushes anything and never moves this repository: a VPN data
# plane should not update itself behind your back, and a conflict is a decision,
# not a build failure.
#
# What it does when upstream tags a release:
#   1. rebuilds the fork on that tag  — upstream tree + overlay + patches
#   2. re-pins deps and runs go mod tidy
#   3. builds, vets, and runs the test suite
#   4. opens (or updates) a single issue with the verdict
#
# Release tags only, not main: main moves daily and half of it never ships.
#
# When the issue says everything applies, adopting it locally is two commands:
#   ./fork/bin/fork adopt vYY.M.D
#   ./fork/bin/fork export        # only if you had to resolve anything

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence for a fork whose whole
    # point is that updates are cheap — often enough to catch a breaking change
    # while it is still one change, rare enough to be ignorable.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to test (blank = newest release tag)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/XTLS/Xray-core.git 2>/dev/null || true
          git fetch --quiet --tags upstream

      - name: Decide what to test
        id: decide
        run: |
          BASE="$(tr -d ' \t\r\n' < fork/upstream.txt)"
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="$(git tag -l --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"

          if [ "$BASE" = "$REF" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already on $BASE — nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream released $REF (we are on $BASE)."
          fi

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.up_to_date == 'false'
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Apply the fork onto ${{ steps.decide.outputs.ref }}
        if: steps.decide.outputs.up_to_date == 'false'
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          ./fork/bin/fork build "${{ steps.decide.outputs.ref }}" /tmp/trial 2>&1 | tee /tmp/apply.log

      - name: Build and test
        if: steps.decide.outputs.up_to_date == 'false' && steps.apply.outcome == 'success'
        id: verify
        continue-on-error: true
        working-directory: /tmp/trial
        run: |
          set -o pipefail
          {
            echo "== go get (pinned deps) + go mod tidy =="
            "$GITHUB_WORKSPACE/fork/bin/fork" deps . 2>&1
            echo ""
            echo "== go build ./... =="
            go build ./... 2>&1
            echo ""
            echo "== go vet (fork packages) =="
            go vet ./proxy/olcrtc/... ./app/dispatcher/... ./common/pause/... ./transport/internet/hysteria/... 2>&1
            echo ""
            echo "== go test ./... =="
            # Geodata-dependent tests need assets this job does not fetch; the
            # question here is "does the fork still work on the new upstream",
            # not "is upstream's suite green", so those are allowed to fail.
            go test -timeout 30m ./... 2>&1 | tail -60
          } | tee /tmp/verify.log

      - name: Compose the report
        if: steps.decide.outputs.up_to_date == 'false'
        id: report
        run: |
          REF="${{ steps.decide.outputs.ref }}"
          BASE="${{ steps.decide.outputs.base }}"

          if [ "${{ steps.apply.outcome }}" != "success" ]; then
            VERDICT="conflicts"
            TITLE="Upstream $REF: patches conflict"
          elif [ "${{ steps.verify.outcome }}" != "success" ]; then
            VERDICT="broken"
            TITLE="Upstream $REF: applies, but build/tests fail"
          else
            VERDICT="clean"
            TITLE="Upstream $REF: applies cleanly"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"     >> "$GITHUB_OUTPUT"

          {
            echo "Upstream released **$REF**; this fork is on **$BASE**."
            echo ""
            case "$VERDICT" in
              clean)
                echo "The fork applies, builds and tests green on it."
                echo ""
                echo "\`\`\`"
                echo "./fork/bin/fork adopt $REF"
                echo "\`\`\`"
                ;;
              conflicts)
                echo "**The patches do not apply.** Rebuild locally and resolve:"
                echo ""
                echo "\`\`\`"
                echo "./fork/bin/fork build $REF /tmp/trial   # leaves conflicts in the tree"
                echo "# resolve there, copy back, then:"
                echo "./fork/bin/fork export"
                echo "\`\`\`"
                ;;
              broken)
                echo "The patches apply, but the result does not build or test cleanly."
                echo "Usually an upstream API change that the overlay has to follow."
                ;;
            esac
            echo ""
            echo "<details><summary>What changed upstream</summary>"
            echo ""
            echo '```'
            git log --oneline "$BASE..$REF" | head -40
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Applying the fork</summary>"
            echo ""
            echo '```'
            cat /tmp/apply.log 2>/dev/null | tail -40
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Build and test</summary>"
            echo ""
            echo '```'
            cat /tmp/verify.log 2>/dev/null | tail -80
            echo '```'
            echo "</details>"
            echo ""
            echo "<sub>Posted by \`upstream-watch\`. Nothing has been changed in this repository.</sub>"
          } > /tmp/body.md

          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.decide.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="${{ steps.report.outputs.title }}"
          REF="${{ steps.decide.outputs.ref }}"

          # One issue per upstream release, reused across re-runs, so a weekly
          # schedule cannot bury the repo in duplicates.
          EXISTING="$(gh issue list --state open --label upstream-update \
                        --search "$REF in:title" --json number,title \
                        --jq ".[] | select(.title | contains(\"$REF\")) | .number" | head -1)"

          gh label create upstream-update --color 1d76db \
            --description "Automated upstream tracking" 2>/dev/null || true

          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file /tmp/body.md
          else
            gh issue create --title "$TITLE" --label upstream-update --body-file /tmp/body.md
          fi

      - name: Fail the run when the fork does not survive
        if: steps.decide.outputs.up_to_date == 'false'
        # The issue is the deliverable, but a red run is what shows up in the
        # Actions tab and in email — worth having when the fork stops applying.
        run: |
          [ "${{ steps.report.outputs.verdict }}" = "clean" ] || {
            echo "::error::Fork does not apply cleanly to ${{ steps.decide.outputs.ref }} — see the issue"
            exit 1
          }
