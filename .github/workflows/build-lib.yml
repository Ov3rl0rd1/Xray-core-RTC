name: Build Xray library

# Builds Xray-core as a C shared library (see libxray/) for embedding in a
# client app over its C ABI, and publishes the result as a release in this
# fork.
#
# Targets: Android arm64-v8a and x86_64, Windows x64.
#
# Deliberately not built: Android armeabi-v7a and x86, and Windows x86. A
# 32-bit Android phone is a rarity the consuming client does not ship for, and
# the client is a 64-bit Windows binary that cannot load a 32-bit DLL anyway.
# The cost of building them is not the CI minutes -- it is ~55 MB per ABI in
# every release archive, and four more artefacts to check when something looks
# wrong. Add a leg back to the matrix if a target ever needs one.
#
# Everything cross-compiles from ubuntu-latest: the Android NDK and mingw-w64
# both run on Linux, so there is no need for a windows runner, and the two jobs
# stay flag-for-flag comparable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the release under (e.g. lib-v1.0.0). Leave empty to build artifacts only, without releasing."
        required: false
        type: string
  push:
    tags:
      - "lib-v*"

permissions:
  contents: write

env:
  NDK_VERSION: r28b
  # -s -w drop the symbol table and DWARF, -buildid= and -trimpath keep build
  # paths and ids out of the output. Together these are the "no debug info"
  # part of the build; there is nothing left worth running strip over.
  LDFLAGS_COMMON: "-s -w -buildid="
  # Applied to the C shims cgo generates. The Go code itself is unaffected.
  CGO_CFLAGS: "-O2 -fstack-protector-strong"

jobs:
  android:
    name: android / ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up NDK
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          echo "NDK_BIN=$(realpath android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64/bin)" >> $GITHUB_ENV

      - name: Build libxray.so
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 1
        run: |
          export CC="${NDK_BIN}/${{ matrix.cc }}"
          mkdir -p out/android/${{ matrix.abi }}
          COMMID=$(git describe --always --dirty)
          # -checklinkname=0: github.com/wlynxg/anet reaches into net.zoneCache
          # through //go:linkname, which the linker rejects by default on
          # Android. Upstream's release workflow disables the check the same way.
          # Security hardening comes from the -extldflags: full RELRO, immediate
          # binding, non-executable stack.
          go build -buildmode=c-shared \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/xtls/xray-core/core.build=${COMMID} ${LDFLAGS_COMMON} -checklinkname=0 -extldflags=-Wl,-z,relro,-z,now,-z,noexecstack" \
            -o out/android/${{ matrix.abi }}/libxray.so \
            ./libxray
          # cgo writes libxray.h next to the output. It is kept per ABI rather
          # than deduplicated because the typedefs differ between 32- and
          # 64-bit targets (GoInt is int32 on one, int64 on the other).
          ls -l out/android/${{ matrix.abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libxray-android-${{ matrix.abi }}
          path: out/

  windows:
    name: windows / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            # High-entropy ASLR is 64-bit only.
            pe_ldflags: -Wl,--nxcompat,--dynamicbase,--high-entropy-va
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64

      - name: Build xray.dll
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p out/windows/${{ matrix.arch }}
          COMMID=$(git describe --always --dirty)
          # DEP and ASLR come from the PE flags below.
          go build -buildmode=c-shared \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/xtls/xray-core/core.build=${COMMID} ${LDFLAGS_COMMON} -extldflags=${{ matrix.pe_ldflags }}" \
            -o out/windows/${{ matrix.arch }}/xray.dll \
            ./libxray
          # cgo writes xray.h next to the output; kept per arch, see the Android
          # job for why.
          ls -l out/windows/${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libxray-windows-${{ matrix.arch }}
          path: out/

  package:
    name: Package and release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          # Every artifact carries the same out/ layout, so merging them gives
          # the final tree: android/<abi>/libxray.so, windows/<arch>/xray.dll,
          # include/libxray.h.
          for DIR in artifacts/*/; do
            cp -r "${DIR}"/* bundle/
          done
          cp libxray/README.md bundle/README.md
          cp LICENSE bundle/LICENSE
          echo "Built from ${GITHUB_SHA}" > bundle/BUILD_INFO
          find bundle -type f | sort
          # A missing target here means one matrix leg silently produced nothing.
          for EXPECTED in \
            bundle/android/arm64-v8a/libxray.so \
            bundle/android/x86_64/libxray.so \
            bundle/windows/x64/xray.dll
          do
            [ -s "${EXPECTED}" ] || { echo "Missing ${EXPECTED}"; exit 1; }
          done

      - name: Create ZIP archive
        run: |
          pushd bundle || exit 1
          zip -9r ../libxray.zip .
          popd || exit 1
          for METHOD in {"sha256","sha512"}
          do
            openssl dgst -${METHOD} libxray.zip | sed 's/([^)]*)//g' >> libxray.zip.dgst
          done

      - name: Upload bundle to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libxray
          path: |
            ./libxray.zip
            ./libxray.zip.dgst

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "value=${INPUT_TAG}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "No tag given and not a tag push, skipping the release."
          fi

      - name: Publish release
        if: steps.tag.outputs.value != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" libxray.zip libxray.zip.dgst --clobber
          else
            gh release create "${TAG}" libxray.zip libxray.zip.dgst \
              --title "libxray ${TAG}" \
              --notes "Xray-core shared library for Android (arm64-v8a, x86_64) and Windows (x64). See README.md in the archive for the C API."
          fi
